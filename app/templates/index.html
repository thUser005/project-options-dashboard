<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Option Feed</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom Styles -->
    <style>
        body {
            font-size: 14px;
        }

        /* Price movement highlights */
        .price-up {
            background-color: #d4edda !important; /* light green */
            transition: background-color 0.5s ease;
        }

        .price-down {
            background-color: #f8d7da !important; /* light red */
            transition: background-color 0.5s ease;
        }

        /* Sticky header */
        thead th {
            position: sticky;
            top: 0;
            z-index: 2;
        }

        /* Compact table */
        table td, table th {
            vertical-align: middle;
            text-align: center;
        }

        /* Loading row style */
        .loading-row {
            color: #6c757d;
            font-style: italic;
        }
    </style>
</head>

<body class="bg-light">

<div class="container-fluid mt-4">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">📈 Live Option Chain</h4>
        <span class="badge bg-success">LIVE</span>
    </div>

    <!-- Controls -->
    <div class="row mb-3">
        <div class="col-md-3">
            <label class="form-label fw-semibold">Index</label>
            <select id="indexSelect" class="form-select form-select-sm"></select>
        </div>

        <div class="col-md-3">
            <label class="form-label fw-semibold">Expiry</label>
            <select id="expirySelect" class="form-select form-select-sm"></select>
        </div>
    </div>

    <!-- Table -->
    <div class="table-responsive" style="max-height: 70vh;">
        <table class="table table-bordered table-sm table-striped">
            <thead class="table-dark">
                <tr>
                    <th style="min-width: 200px;">Symbol</th>
                    <th style="min-width: 90px;">LTP</th>
                    <th style="min-width: 100px;">OI</th>
                    <th style="min-width: 100px;">Volume</th>
                    <th style="min-width: 160px;">Timestamp</th>
                </tr>
            </thead>
            <tbody id="optionTableBody">
                <tr>
                    <td colspan="5" class="text-center loading-row">
                        Loading option chain…
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<!-- App JS -->
<script src="/static/app.js"></script>

</body>
</html>
